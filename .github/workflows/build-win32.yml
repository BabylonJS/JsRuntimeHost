name: Build Win32

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      js-engine:
        required: true
        type: string

jobs:
  build:
    runs-on: windows-2022
    # Hermes pulls in a large LLVH/Boost.Context/BCGen chain through
    # `hermesvm_a`; on `windows-2022` the full configure+build comfortably
    # exceeds the standard 15-minute window.  Keep other engines snappy.
    timeout-minutes: ${{ inputs.js-engine == 'Hermes' && 60 || 15 }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure CMake
        run: cmake -B Build/Win32 -A ${{ inputs.platform }} -D NAPI_JAVASCRIPT_ENGINE=${{ inputs.js-engine }}

      - name: Build Solution
        run: cmake --build Build/Win32 --config RelWithDebInfo -- /m

      - name: Enable Crash Dumps
        shell: cmd
        run: |
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\UnitTests.exe" /f
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\UnitTests.exe" /v DumpType /t REG_DWORD /d 2 /f
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\UnitTests.exe" /v DumpCount /t REG_DWORD /d 1 /f
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\UnitTests.exe" /v DumpFolder /t REG_SZ /d "%RUNNER_TEMP%\Dumps" /f

      - name: Install ProcDump as the postmortem debugger
        shell: pwsh
        run: |
          # The WER LocalDumps registration above has produced no .dmp on this runner image for a
          # plain access violation, so the "crash dumps" artifact only ever held the exe and pdb.
          # ProcDump registered as the just-in-time (AeDebug) debugger writes a full dump for any
          # crashing process regardless of WER's policy; the artifact step below uploads it.
          $zip = Join-Path $env:RUNNER_TEMP "Procdump.zip"
          Invoke-WebRequest -Uri "https://download.sysinternals.com/files/Procdump.zip" -OutFile $zip
          $tools = Join-Path $env:RUNNER_TEMP "procdump"
          Expand-Archive -Path $zip -DestinationPath $tools -Force
          $dumps = Join-Path $env:RUNNER_TEMP "Dumps"
          New-Item -ItemType Directory -Force -Path $dumps | Out-Null
          & (Join-Path $tools "procdump.exe") -accepteula -ma -i $dumps

      - name: Run Tests
        shell: cmd
        working-directory: Build/Win32/Tests/UnitTests/RelWithDebInfo
        run: UnitTests.exe

      - name: Stage Test App for Crash Dumps
        if: failure()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\Dumps" | Out-Null
          Copy-Item -Path "Build\Win32\Tests\UnitTests\RelWithDebInfo\UnitTests.*" -Destination "$env:RUNNER_TEMP\Dumps\" -ErrorAction SilentlyContinue

      - name: Upload Crash Dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.platform }}-${{ inputs.js-engine }}-crash-dumps
          path: ${{ runner.temp }}/Dumps/
          if-no-files-found: ignore
