name: Build iOS

on:
  workflow_call:
    inputs:
      xcode-version:
        required: true
        type: string
      runs-on:
        required: false
        type: string
        default: macos-latest
      simulator:
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode ${{ inputs.xcode-version }}
        run: sudo xcode-select --switch /Applications/Xcode_${{ inputs.xcode-version }}.app/Contents/Developer

      - name: Configure CMake
        run: cmake -B Build/iOS -G Xcode -D IOS=ON

      - name: Boot Simulator
        run: xcrun simctl boot "${{ inputs.simulator }}"

      - name: Build
        run: |
          xcodebuild \
            -project Build/iOS/JsRuntimeHost.xcodeproj \
            -scheme UnitTests \
            -sdk iphonesimulator \
            -configuration RelWithDebInfo

      - name: Run Tests
        run: |
          xcrun simctl install booted "Build/iOS/Tests/UnitTests/RelWithDebInfo-iphonesimulator/UnitTests.app"
          # The app reports its exit code as the last line of stderr (see iOS/App.mm). Tests may
          # write to stderr too, so only the last line is the code: handing the whole capture to
          # `exit` fails with "numeric argument required" (255) as soon as anything else is there.
          xcrun simctl launch --console booted "com.jsruntimehost.unittests" 2> /tmp/stderr
          cat /tmp/stderr
          (exit "$(tail -n 1 /tmp/stderr)")

      # A crashed app writes nothing to the exit-code pipe (the step then fails with 255) and the
      # console shows only what was flushed before the crash; the simulator's unified log and
      # ReportCrash's .ips are the only record of where it died.
      - name: Collect crash reports
        if: failure()
        run: |
          sleep 10
          xcrun simctl spawn booted log show --last 10m --style compact \
            --predicate 'process == "UnitTests" OR process == "ReportCrash" OR eventMessage CONTAINS "UnitTests"' \
            2>/dev/null | tail -n 200 || true
          for report in $(ls -t ~/Library/Logs/DiagnosticReports/UnitTests*.ips 2>/dev/null | head -n 3); do
            echo "::group::$report"
            python3 - "$report" <<'PY'
          import json, sys
          raw = open(sys.argv[1]).read()
          header, body = raw.split("\n", 1)
          crash = json.loads(body)
          images = crash.get("usedImages", [])
          print("exception:", json.dumps(crash.get("exception")), "termination:", json.dumps(crash.get("termination")))
          faulting = crash.get("faultingThread", 0)
          for index, thread in enumerate(crash.get("threads", [])):
              if index != faulting and not thread.get("triggered"):
                  continue
              print(f"--- thread {index} {thread.get('name') or ''} {thread.get('queue') or ''}")
              for frame in thread.get("frames", [])[:40]:
                  image = images[frame.get("imageIndex", 0)] if frame.get("imageIndex", 0) < len(images) else {}
                  print(f"  {image.get('name', '?'):28s} {frame.get('symbol', '?')}+{frame.get('symbolLocation', 0)}")
          PY
            echo "::endgroup::"
          done
